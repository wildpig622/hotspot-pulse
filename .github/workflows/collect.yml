name: Daily hotspot collection

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotspot-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect public event candidates
        id: collect
        run: python scripts/collect.py
        continue-on-error: true

      - name: Commit refreshed JSON snapshots
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/v1
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore(data): refresh hotspot feed"
            git push
          fi

      - name: Fail workflow if every feed failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collection failed. Previous event data was preserved; inspect health.json and logs."
          exit 1
