name: Collect hotspot candidates (manual)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Reviewed main commit (full 40-character SHA)"
        required: true
        type: string
      confirmation:
        description: "Type COLLECT_PENDING_ONLY to request live collection and snapshot writes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hotspot-collection
  cancel-in-progress: false

jobs:
  check-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manual collection request
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/check_manual_execution.py collect

  collect:
    needs: check-request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.expected_sha == github.sha &&
      inputs.confirmation == 'COLLECT_PENDING_ONLY'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect public event candidates
        id: collect
        run: python scripts/collect.py
        continue-on-error: true

      - name: Commit refreshed JSON snapshots
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/v1
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore(data): refresh hotspot feed"
            git push origin HEAD:refs/heads/main
          fi

      - name: Fail workflow if every feed failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collection failed. Previous event data was preserved; inspect health.json and logs."
          exit 1
